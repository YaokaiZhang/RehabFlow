      current_time: '2026-07-21T00:00:00+00:00'
      episode_memory:
      - care_episode_id: episode-ankle
        content: PT note EP-ANK-2026-07-15 records 8 degrees dorsiflexion and 3/10 stiffness after stairs; gentle unloaded
          motion is allowed in episode-ankle, while loaded inversion remains deferred.
        id: ankle-limit
        provenance: saved_triage_summary
        recorded_at: '2026-07-16T00:00:00+00:00'
        source_id: source-ankle-limit
        status: active
        title: Ankle Limit
      - care_episode_id: episode-shoulder
        content: PT note EP-SHO-2026-07-15 records shoulder abduction limited to 90 degrees after lifting; this episode-specific
          restriction belongs to episode-shoulder, not the active ankle episode.
        id: shoulder-limit
        provenance: saved_triage_summary
        recorded_at: '2026-07-16T00:00:00+00:00'
        source_id: source-shoulder-limit
        status: active
        title: Shoulder Limit
      evidence:
      - authorized: true
        observed: true
        content: Ankle ultrasound dated 2026-07-18 describes a grade-I anterior talofibular ligament sprain without fracture.
          Use pain-limited motion, avoid loaded inversion for ten days, and do not transfer this episode note to the shoulder.
        id: rehab_knowledge:public
        recorded_at: '2026-07-21T00:00:00+00:00'
      - authorized: false
        observed: false
        content: Restricted shoulder MRI draft RS-2026-07-18 describes a rotator-cuff finding; it is outside episode-ankle
          and is not authorized for this evaluation.
        id: rehab_knowledge:restricted
        recorded_at: '2026-07-21T00:00:00+00:00'
