    - care_episode_id: episode-ankle
      op: start_session
      session_id: session-episode
    - message: For this active ankle episode, the ankle feels mildly stiff after sitting, with no pain, swelling, redness, warmth, new injury or surgery, and I can bear weight and walk normally. Should I use unloaded motion while the
        older shoulder restriction stays out?
