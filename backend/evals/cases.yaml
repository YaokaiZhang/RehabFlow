        status: inactive
      catalog:
      - authorized: true
        content: Seated ankle alphabet for gentle range of motion after acute injury.
        contraindications: No suspected fracture, sharp pain, or rapidly increasing swelling.
        difficulty: easy
        duration_seconds: 60
        exercise_id: exercise-ankle-1
        id: exercise-ankle-1
