services:
  postgres:
    image: ${IMAGE_REGISTRY:-docker.io}/library/postgres:16
    environment:
      POSTGRES_USER: rehab
      POSTGRES_PASSWORD: rehab
      POSTGRES_DB: rehab_agent
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${REHABFLOW_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rehab -d rehab_agent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: ${IMAGE_REGISTRY:-docker.io}/library/redis:7
    ports:
      - "127.0.0.1:${REHABFLOW_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: ${IMAGE_REGISTRY:-docker.io}/qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:${REHABFLOW_QDRANT_PORT:-6333}:6333"
      - "127.0.0.1:${REHABFLOW_QDRANT_GRPC_PORT:-6334}:6334"
    healthcheck:
      test: ["CMD", "bash", "-c", "set -euo pipefail; exec 3<>/dev/tcp/127.0.0.1/6333; printf 'GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3; head -n 1 <&3 | grep -q '200 OK'"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
      args:
        IMAGE_REGISTRY: ${IMAGE_REGISTRY:-docker.io}
        REHAB_BACKEND_BASE: http://localhost:${BACKEND_PORT:-8000}
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg2://rehab:rehab@postgres:5432/rehab_agent
      POSTGRES_URL: postgresql+psycopg2://rehab:rehab@postgres:5432/rehab_agent
      CHECKPOINT_DATABASE_URL: postgresql://rehab:rehab@postgres:5432/rehab_agent
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      FRONTEND_ORIGIN: http://localhost:${PRODUCT_FRONTEND_PORT:-3000}
      BACKEND_PORT: 8000
      ENVIRONMENT: development
      # Anthropic API key for all LLM calls, from the shell or .env.
      LLM_KEY: ${LLM_KEY:-}
      REHAB_ALLOW_DESTRUCTIVE_MEMORY_MIGRATION: ${REHAB_ALLOW_DESTRUCTIVE_MEMORY_MIGRATION:-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 20

  product:
    build:
      context: .
      dockerfile: product.Dockerfile
      args:
        IMAGE_REGISTRY: ${IMAGE_REGISTRY:-docker.io}
        REHAB_BACKEND_BASE: http://backend:8000
    env_file:
      - path: .env
        required: false
    environment:
      BACKEND_PORT: 8000
      NEXT_PUBLIC_BACKEND_PORT: 8000
      REHAB_BACKEND_BASE: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PRODUCT_FRONTEND_PORT:-3000}:3000"

volumes:
  postgres_data:
  qdrant_data:
